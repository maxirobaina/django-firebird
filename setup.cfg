[metadata]
name = django-firebird
version = attr: django_firebird.__version__
description = Firebird backend for Django web framework
long_description = file: README.rst
long_description_content_type = text/x-rst
author = Maximiliano Robaina
author_email = maxirobaina@gmail.com
url = https://github.com/maxirobaina/django-firebird
download_url = https://pypi.org/project/django-firebird/
license = BSD
license_files = LICENSE
classifiers =
    Development Status :: 5 - Production/Stable
    Environment :: Web Environment
    Framework :: Django
    Framework :: Django :: 6.1
    Intended Audience :: Developers
    License :: OSI Approved :: BSD License
    Operating System :: OS Independent
    Programming Language :: Python
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    Topic :: Database
    Topic :: Internet :: WWW/HTTP

[options]
python_requires = >=3.12
zip_safe = false
install_requires =
    firebird-driver>=2.0.0

